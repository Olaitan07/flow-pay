# Infrastructure and services. Bring up: docker compose up --build -d
# WARNING: `docker compose down -v` deletes all database volumes.
name: flowpay

services:
  auth-db:
    image: postgres:17
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5433:5432"]
    volumes: ["auth-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5434:5432"]
    volumes: ["user-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d user_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  wallet-db:
    image: postgres:17
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5435:5432"]
    volumes: ["wallet-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d wallet_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  transaction-db:
    image: postgres:17
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5436:5432"]
    volumes: ["transaction-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d transaction_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5437:5432"]
    volumes: ["ledger-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d ledger_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-db:
    image: postgres:17
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER:-flowpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5438:5432"]
    volumes: ["notification-db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowpay} -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: ["kafka-data:/var/lib/kafka/data"]

  auth-service:
    build: {context: ., args: {SERVICE: auth-service}}
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      auth-db: {condition: service_healthy}

  user-service:
    build: {context: ., args: {SERVICE: user-service}}
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      AUTH_SERVICE_URL: http://auth-service:8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      user-db: {condition: service_healthy}
      auth-service: {condition: service_started}

  wallet-service:
    build: {context: ., args: {SERVICE: wallet-service}}
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://wallet-db:5432/wallet_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      wallet-db: {condition: service_healthy}
      redis: {condition: service_healthy}

  transaction-service:
    build: {context: ., args: {SERVICE: transaction-service}}
    ports: ["8084:8084"]
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-db:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      transaction-db: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}

  ledger-service:
    build: {context: ., args: {SERVICE: ledger-service}}
    ports: ["8085:8085"]
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/ledger_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      ledger-db: {condition: service_healthy}
      kafka: {condition: service_started}

  notification-service:
    build: {context: ., args: {SERVICE: notification-service}}
    ports: ["8086:8086"]
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      notification-db: {condition: service_healthy}
      kafka: {condition: service_started}

  api-gateway:
    build: {context: ., args: {SERVICE: api-gateway}}
    ports: ["8080:8080"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      WALLET_SERVICE_URL: http://wallet-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8084
      LEDGER_SERVICE_URL: http://ledger-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in .env}
    depends_on: [auth-service, user-service, wallet-service, transaction-service, ledger-service, notification-service]

volumes:
  auth-db-data:
  user-db-data:
  wallet-db-data:
  transaction-db-data:
  ledger-db-data:
  notification-db-data:
  redis-data:
  kafka-data:

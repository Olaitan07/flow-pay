server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:flowpay}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowpay:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s
  security:
    internal-api-key: ${INTERNAL_API_KEY}

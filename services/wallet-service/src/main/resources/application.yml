server:
  port: 8083

spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/wallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:flowpay}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowpay:
  security:
    internal-api-key: ${INTERNAL_API_KEY}
  wallet:
    # Currencies a wallet may be opened in. Comma separated ISO 4217 codes.
    supported-currencies: ${WALLET_SUPPORTED_CURRENCIES:NGN}
    kyc:
      url: ${KYC_SERVICE_URL:http://localhost:8087}
      # Lowest KYC level that may open a wallet.
      required-level: 1

# API documentation (Swagger UI at /swagger-ui.html, spec at /v3/api-docs). Set DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}

server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:flowpay}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowpay:
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  security:
    internal-api-key: ${INTERNAL_API_KEY}
    jwt:
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      issuer: flowpay-auth
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    password-reset:
      token-ttl: 30m
      url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    otp:
      ttl: 5m
      max-attempts: 5

# API documentation (Swagger UI at /swagger-ui.html, spec at /v3/api-docs). Set DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}

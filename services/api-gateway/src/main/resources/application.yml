server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates: [Path=/api/v1/auth/**]
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates: [Path=/api/v1/users/**]
            - id: wallet-service
              uri: ${WALLET_SERVICE_URL:http://localhost:8083}
              predicates: [Path=/api/v1/wallets/**]
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
              predicates: 
                - Path=/api/v1/transfers/**, /api/v1/transactions/**
            - id: ledger-service
              uri: ${LEDGER_SERVICE_URL:http://localhost:8085}
              predicates: [Path=/api/v1/ledger/**]
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates: [Path=/api/v1/notifications/**]

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowpay:
  docs:
    enabled: ${DOCS_ENABLED:true}
  rate-limit:
    registration:
      max-requests: ${REGISTRATION_RATE_LIMIT_MAX:5}
      window: ${REGISTRATION_RATE_LIMIT_WINDOW:1m}
    login:
      max-requests: ${LOGIN_RATE_LIMIT_MAX:10}
      window: ${LOGIN_RATE_LIMIT_WINDOW:1m}
    password-reset:
      max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX:5}
      window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:1m}
    mfa:
      max-requests: ${MFA_RATE_LIMIT_MAX:10}
      window: ${MFA_RATE_LIMIT_WINDOW:1m}
  security:
    jwt:
      public-key: ${JWT_PUBLIC_KEY}
      issuer: flowpay-auth

# Swagger UI at http://localhost:8080/swagger-ui.html, showing the merged specs in static/openapi/
# (regenerate them with scripts/build-api-docs.py). Set DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}
    persist-authorization: true
    try-it-out-enabled: true
    urls:
      - name: FlowPay API (through the gateway)
        url: /openapi/flowpay-openapi.json
      - name: Internal service APIs (direct ports)
        url: /openapi/flowpay-internal-openapi.json

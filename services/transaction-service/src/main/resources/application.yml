server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/transaction_db}
    username: ${SPRING_DATASOURCE_USERNAME:flowpay}
    password: ${SPRING_DATASOURCE_PASSWORD:flowpay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowpay:
  security:
    internal-api-key: ${INTERNAL_API_KEY}
  transaction:
    wallet:
      url: ${WALLET_SERVICE_URL:http://localhost:8083}
    kyc:
      url: ${KYC_SERVICE_URL:http://localhost:8087}
    transfer:
      # Flat fee charged to the sender on top of the amount. Epic 11 (Fees) will replace this with real fee rules.
      fee: ${TRANSFER_FEE:100.00}
    recovery:
      # Fundings and transfers left unfinished (the wallet service was unreachable) are retried every interval once they
      # have waited at least min-age.
      interval: 30s
      min-age: 20s

# API documentation (Swagger UI at /swagger-ui.html, spec at /v3/api-docs). Set DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}
